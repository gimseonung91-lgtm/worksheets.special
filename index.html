<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글씨 쓰기 워크시트 생성기</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #e8f4fd;
      --blue: #3a86c8;
      --blue-dark: #2563a0;
      --green: #4caf88;
      --yellow: #f9c74f;
      --red: #f4845f;
      --purple: #7c5cbf;
      --purple-light: #f3eeff;
      --gray-light: #d0d0d0;
      --gray-mid: #888;
      --border: #2b2b2b;
      --bg: #f0f7ff;
      --card: #ffffff;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nanum Gothic', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 60px;
    }

    /* ── 헤더 ── */
    header { text-align: center; margin-bottom: 32px; }
    header .badge {
      display: inline-block; background: var(--yellow); color: #333;
      font-size: 12px; font-weight: 800; letter-spacing: 1px;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 10px;
    }
    header h1 { font-size: 28px; font-weight: 800; color: var(--blue-dark); line-height: 1.3; }
    header h1 span { color: var(--red); }
    header p { color: var(--gray-mid); margin-top: 8px; font-size: 14px; }

    /* ── 패널 ── */
    .panel {
      background: var(--card); border: 2.5px solid var(--border);
      border-radius: var(--radius); padding: 28px 32px;
      width: 100%; max-width: 680px;
      box-shadow: 5px 5px 0 var(--border); margin-bottom: 28px;
    }
    .panel-title {
      font-size: 13px; font-weight: 800; color: var(--gray-mid);
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px;
    }

    /* ── 입력창 ── */
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-weight: 700; font-size: 15px; color: #333; margin-bottom: 8px; }
    .input-group input[type="text"] {
      width: 100%; padding: 12px 16px; border: 2.5px solid var(--border);
      border-radius: 8px; font-size: 18px; font-family: 'Nanum Gothic', sans-serif;
      font-weight: 700; color: #222; background: #fafafa; outline: none;
      transition: border-color 0.2s;
    }
    .input-group input[type="text"]:focus { border-color: var(--blue); background: #fff; }
    .input-group input[type="text"]::placeholder { color: #bbb; font-weight: 400; }

    /* ── 모드 선택 ── */
    .mode-group { margin-bottom: 24px; }
    .mode-group label.group-label { display: block; font-weight: 700; font-size: 15px; color: #333; margin-bottom: 12px; }
    .mode-options { display: flex; gap: 12px; flex-wrap: wrap; }
    .mode-card { flex: 1; min-width: 160px; position: relative; cursor: pointer; }
    .mode-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .mode-card .card-inner {
      border: 2.5px solid var(--border); border-radius: 10px; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s; background: #fafafa;
    }
    .mode-card input[type="radio"]:checked + .card-inner {
      background: var(--sky); border-color: var(--blue); box-shadow: 3px 3px 0 var(--blue);
    }
    .mode-card.vocab-card input[type="radio"]:checked + .card-inner {
      background: var(--purple-light); border-color: var(--purple); box-shadow: 3px 3px 0 var(--purple);
    }
    .mode-card .card-inner:hover { transform: translateY(-1px); }
    .mode-icon { font-size: 28px; flex-shrink: 0; }
    .mode-text strong { display: block; font-size: 14px; font-weight: 800; color: #222; }
    .mode-text span { font-size: 12px; color: var(--gray-mid); }

    /* ── 그리드 크기 선택 (모드 1·2 / 모드 3 각각 따로) ── */
    .size-options { display: flex; gap: 10px; flex-wrap: wrap; }
    .size-card { flex: 1; min-width: 80px; position: relative; cursor: pointer; }
    .size-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .size-card .size-inner {
      border: 2.5px solid var(--border); border-radius: 10px; padding: 12px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      background: #fafafa; text-align: center;
    }
    .size-card input[type="radio"]:checked + .size-inner {
      background: #fff8e7; border-color: #d4a017; box-shadow: 3px 3px 0 #d4a017;
    }
    .size-card .size-inner:hover { transform: translateY(-1px); }
    .size-num { font-size: 16px; font-weight: 800; color: #222; }
    .size-desc { font-size: 11px; color: var(--gray-mid); }

    /* ── 버튼 ── */
    .btn-generate {
      width: 100%; padding: 14px; background: var(--blue-dark); color: #fff;
      border: 2.5px solid var(--border); border-radius: 10px;
      font-size: 16px; font-weight: 800; font-family: 'Nanum Gothic', sans-serif;
      cursor: pointer; box-shadow: 4px 4px 0 var(--border);
      transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
    }
    .btn-generate:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--border); }
    .btn-generate:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--border); }
    .btn-generate.vocab-mode { background: var(--purple); }

    /* ── 미리보기 ── */
    #preview-section { width: 100%; max-width: 860px; display: none; }
    .preview-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .preview-actions h2 { font-size: 16px; font-weight: 800; color: #444; }
    .btn-print {
      padding: 10px 24px; background: var(--green); color: #fff;
      border: 2.5px solid var(--border); border-radius: 8px;
      font-size: 14px; font-weight: 800; font-family: 'Nanum Gothic', sans-serif;
      cursor: pointer; box-shadow: 3px 3px 0 var(--border);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-print:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--border); }

    /* ── 워크시트 공통 ── */
    #worksheet {
      background: #fff; border: 2.5px solid var(--border);
      border-radius: var(--radius); padding: 40px 48px;
      box-shadow: 6px 6px 0 var(--border); font-family: 'Nanum Gothic', sans-serif;
    }
    .ws-header { text-align: center; margin-bottom: 28px; }
    .ws-header .ws-title {
      font-size: 22px; font-weight: 800; color: #111;
      display: inline-block; border-bottom: 3px solid var(--yellow); padding-bottom: 4px;
    }

    /* ── 모드 1·2 그리드 ── */
    .ws-sentence-display {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      margin-bottom: 28px; padding: 20px;
      background: #f8f9fa; border: 2px solid var(--border); border-radius: 10px;
    }
    .ws-sentence-display .char-chip {
      width: 60px; height: 60px; border: 2px solid var(--border); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #111; background: #fff;
    }
    .ws-grid {
      display: grid;
      border-top: 2.5px solid var(--border);
      border-left: 2.5px solid var(--border);
    }
    .ws-cell {
      border-right: 2.5px solid var(--border);
      border-bottom: 2.5px solid var(--border);
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(60px,18vw,140px); line-height: 1; font-weight: 700;
      background: #fff; overflow: hidden;
    }
    .ws-cell.trace-char { color: var(--gray-light); user-select: none; }
    .ws-cell.empty-char { color: transparent; }

    /* ════════════════════════════════════════════
       모드 3 · 단어 학습 레이아웃
       ─ 좌측: 이미지 박스 (행 수에 따라 축소)
       ─ 우측: CSS grid 기반 단어 반복 쓰기 그리드
       ─ 셀 크기·글자 크기는 JS에서 --cell-size / font-size로 주입
    ════════════════════════════════════════════ */
    .vocab-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    /* 좌측 이미지 박스: JS에서 width 주입 */
    .vocab-image-box {
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .vocab-img-wrap {
      /* width/height는 JS에서 style로 주입 */
      border: 3px solid var(--border); border-radius: 12px;
      overflow: hidden; background: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
    }
    .vocab-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .img-placeholder {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; color: var(--gray-mid); font-size: 13px; font-weight: 700;
      text-align: center; padding: 16px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #ddd; border-top-color: var(--purple);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .vocab-word-label {
      font-weight: 800; color: #111;
      letter-spacing: 2px; text-align: center;
      border-bottom: 3px solid var(--purple); padding-bottom: 4px;
      /* font-size는 JS에서 주입 */
    }
    .btn-reload-img {
      padding: 7px 14px; background: #fff;
      border: 2px solid var(--purple); border-radius: 8px;
      color: var(--purple); font-size: 13px; font-weight: 800;
      font-family: 'Nanum Gothic', sans-serif; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-reload-img:hover { background: var(--purple-light); }

    /* 이미지 조작 버튼 그룹 */
    .img-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .img-controls .btn-reload-img {
      width: 100%;
      text-align: center;
    }

    /* 우측 반복 쓰기 그리드
       ─ 열 수 = 글자 수, 행 수 = 반복 횟수
       ─ 셀 크기는 JS에서 --cell-sz 변수로 주입 → 정사각형 고정
    */
    .vocab-grid-box { flex: 1; min-width: 0; }
    .vocab-write-grid {
      display: grid;
      border-top: 2.5px solid var(--border);
      border-left: 2.5px solid var(--border);
      /* grid-template-columns / grid-auto-rows 는 JS에서 주입 */
    }
    .vocab-write-cell {
      border-right: 2.5px solid var(--border);
      border-bottom: 2.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      background: #fff;
      overflow: hidden;
      /* width/height/font-size 는 JS에서 주입 */
    }
    /* 힌트: 연한 회색 */
    .vocab-write-cell.hint { color: var(--gray-light); }
    /* 빈 칸 */
    .vocab-write-cell.blank { color: transparent; }

    /* ── 태블릿 모드 툴바 ── */
    .tablet-toolbar {
      display: none;
      align-items: center; gap: 12px; flex-wrap: wrap;
      background: #fff8e7; border: 2.5px solid var(--border);
      border-radius: 10px; padding: 12px 18px; margin-bottom: 14px;
      box-shadow: 3px 3px 0 var(--border);
    }
    .tablet-toolbar.active { display: flex; }
    .toolbar-label {
      font-size: 13px; font-weight: 800; color: #555; margin-right: 4px;
    }
    .toolbar-colors { display: flex; gap: 7px; align-items: center; }
    .color-dot {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid transparent; cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: var(--border); transform: scale(1.25); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--border); }
    .toolbar-sizes { display: flex; gap: 7px; align-items: center; }
    .size-dot {
      border-radius: 50%; background: #333; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .size-dot.selected { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--border); }
    .size-dot:hover { transform: scale(1.2); }
    .toolbar-sep { width: 1px; height: 30px; background: #ddd; }
    .btn-toolbar {
      padding: 7px 14px; border: 2px solid var(--border); border-radius: 8px;
      font-size: 13px; font-weight: 800; font-family: 'Nanum Gothic', sans-serif;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      background: #fff; color: #333;
    }
    .btn-toolbar:hover { background: #f0f0f0; transform: translateY(-1px); }
    .btn-toolbar.danger { border-color: var(--red); color: var(--red); }
    .btn-toolbar.danger:hover { background: #fff0ec; }

    /* 태블릿 모드 토글 버튼 */
    .btn-tablet {
      padding: 10px 20px; background: #fff8e7; color: #b07800;
      border: 2.5px solid var(--border); border-radius: 8px;
      font-size: 14px; font-weight: 800; font-family: 'Nanum Gothic', sans-serif;
      cursor: pointer; box-shadow: 3px 3px 0 var(--border);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }
    .btn-tablet:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--border); }
    .btn-tablet.active { background: var(--yellow); color: #7a5500; }

    /* 각 셀 위에 겹쳐지는 캔버스 */
    .ws-cell, .vocab-write-cell {
      position: relative;
    }
    .cell-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 0;
      touch-action: none;
      cursor: crosshair;
      display: none; /* 기본 숨김 */
    }
    body.tablet-active .cell-canvas { display: block; }
    body.tablet-active .ws-cell { cursor: none; }
    body.tablet-active .vocab-write-cell { cursor: none; }

    /* ── 필기 가이드 피드백 ── */

    /* 잘 씀: 파란 배경 */
    .ws-cell.cell-good,
    .vocab-write-cell.cell-good {
      background: #dbeeff !important;
      transition: background 0.5s ease;
    }
    /* 이탈: 빨간 테두리 경고 (일시적) */
    .ws-cell.cell-warn,
    .vocab-write-cell.cell-warn {
      background: #fff0ec !important;
      transition: background 0.3s ease;
    }

    /* 가이드 토스트 메시지 */
    #guide-toast {
      position: fixed;
      bottom: 40px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #d63030; color: #fff;
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 17px; font-weight: 800;
      padding: 14px 30px; border-radius: 40px;
      border: 2.5px solid #9a0000;
      box-shadow: 0 6px 24px rgba(0,0,0,0.22);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 9999;
      white-space: nowrap;
    }
    #guide-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .btn-toolbar.eraser-active {
      background: #fff3cd; border-color: #e67c00; color: #b05000;
      box-shadow: 2px 2px 0 #e67c00;
    }

    /* 전체 지우기 확인 오버레이 */
    #clear-confirm-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 10000;
      align-items: center; justify-content: center;
    }
    #clear-confirm-overlay.show { display: flex; }
    #clear-confirm-box {
      background: #fff; border: 2.5px solid var(--border);
      border-radius: 14px; padding: 28px 32px; text-align: center;
      box-shadow: 6px 6px 0 var(--border); max-width: 320px; width: 90%;
    }
    #clear-confirm-box .confirm-icon { font-size: 40px; margin-bottom: 10px; }
    #clear-confirm-box p {
      font-size: 16px; font-weight: 800; color: #222;
      line-height: 1.6; margin-bottom: 20px;
    }
    #clear-confirm-box .confirm-btns { display: flex; gap: 10px; justify-content: center; }
    #clear-confirm-box .confirm-btns button {
      flex: 1; padding: 11px 0; border-radius: 8px;
      font-size: 14px; font-weight: 800; font-family: 'Nanum Gothic', sans-serif;
      cursor: pointer; border: 2.5px solid var(--border);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #clear-confirm-box .confirm-btns button:active { transform: translate(1px,1px); }
    .confirm-ok  { background: var(--red);   color: #fff; box-shadow: 3px 3px 0 var(--border); }
    .confirm-no  { background: #f0f0f0; color: #333; box-shadow: 3px 3px 0 var(--border); }

    /* ════════════════════════════════════════════
       [태블릿 가로모드] 워크시트를 가로 화면에 꽉 차게 표시
       ─ 입력 패널/헤더를 숨기고 미리보기를 화면 전체로 확장
       ─ 워크시트는 JS(fitWorksheetToScreen)가 scale을 주입해 꽉 차게 키움
    ════════════════════════════════════════════ */
    body.tablet-active { overflow: hidden; padding: 0; height: 100vh; }
    body.tablet-active header,
    body.tablet-active .panel { display: none !important; }

    body.tablet-active #preview-section {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh; max-width: none;
      margin: 0; padding: 8px 12px;
      background: var(--bg); z-index: 500;
      display: flex; flex-direction: column;
    }
    body.tablet-active .preview-actions { margin-bottom: 6px; flex-shrink: 0; }
    body.tablet-active .tablet-toolbar  { margin-bottom: 6px; flex-shrink: 0; }

    /* 남은 공간을 모두 차지하며 워크시트를 가운데 정렬하는 영역 */
    body.tablet-active #worksheet-scale-area {
      flex: 1 1 auto; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    body.tablet-active #worksheet {
      margin: 0; flex-shrink: 0;
      transform-origin: center center;
      box-shadow: 4px 4px 0 var(--border);
      /* width / transform 은 fitWorksheetToScreen()에서 주입 */
    }

    /* ── 인쇄 ── */
    @media print {
      body { background: #fff; padding: 0; display: block; }
      header, .panel, .preview-actions { display: none !important; }
      #preview-section { display: block !important; max-width: 100%; }
      #worksheet {
        border: none; box-shadow: none; border-radius: 0;
        padding: 8mm 10mm; width: 210mm; margin: 0 auto;
        /* min-height 제거 — 내용물이 A4 안에 딱 맞게 */
      }
      .ws-header { margin-bottom: 16px; }
      .ws-header .ws-title { font-size: 16pt; }
      .ws-cell { font-size: 60pt; line-height: 1; }
      .ws-sentence-display .char-chip { font-size: 20pt; width: 44pt; height: 44pt; }
      /* vocab: 셀 크기는 JS가 이미 mm 단위로 주입하므로 추가 override 불필요 */
      .vocab-img-wrap { border-radius: 8px !important; }
      .vocab-word-label { }
      .btn-reload-img { display: none !important; }
      .img-controls   { display: none !important; }
      .cell-canvas { display: none !important; }
      .tablet-toolbar, .btn-tablet { display: none !important; }
      /* [태블릿 가로모드] 인쇄 시에는 전체화면/scale을 해제해 A4로 정상 출력 */
      body.tablet-active { overflow: visible !important; height: auto !important; }
      body.tablet-active #preview-section { position: static !important; height: auto !important; padding: 0 !important; }
      body.tablet-active #worksheet { transform: none !important; width: auto !important; box-shadow: none !important; }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- 가이드 토스트 -->
  <div id="guide-toast">✋ 천천히 다시 써보세요!</div>

  <!-- 전체 지우기 확인 팝업 -->
  <div id="clear-confirm-overlay">
    <div id="clear-confirm-box">
      <div class="confirm-icon">🗑️</div>
      <p>모든 칸의 필기를<br>전부 지울까요?</p>
      <div class="confirm-btns">
        <button class="confirm-ok" onclick="confirmClearAll()">지우기</button>
        <button class="confirm-no" onclick="closeClearConfirm()">취소</button>
      </div>
    </div>
  </div>

  <header>
    <div class="badge">✏️ 특수학급 & 초등 저학년용</div>
    <h1>글씨 쓰기 <span>워크시트</span> 생성기</h1>
    <p>문장을 입력하고 모드를 선택하면 인쇄 가능한 워크시트가 자동으로 만들어져요!</p>

    <!-- [태블릿 가로모드]: 워크시트를 화면 중앙에 두고 scale로 키우기 위한 래퍼 -->

  <script>
    /* ─────────────────────────────────────────
       모드 변경 시 UI 전환
    ───────────────────────────────────────── */
    function onModeChange() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const sg12  = document.getElementById('size-group-12');
      const sg3   = document.getElementById('size-group-3');
      const vwm   = document.getElementById('vocab-write-mode-group');
      const label = document.getElementById('input-label');
      const input = document.getElementById('sentence-input');
      const btn   = document.getElementById('btn-generate');

      if (mode === '3') {
        sg12.style.display  = 'none';
        sg3.style.display   = 'block';
        vwm.style.display   = 'block';
        label.textContent   = '🖼️ 학습할 단어 입력 (단어 하나)';
        input.placeholder   = '예: 사과, 광합성, 고양이';
        input.maxLength     = 10;
        btn.textContent     = '🖼️ 단어 학습 워크시트 만들기';
        btn.classList.add('vocab-mode');
      } else {
        sg12.style.display  = 'block';
        sg3.style.display   = 'none';
        vwm.style.display   = 'none';
        label.textContent   = '📝 연습할 문장 입력';
        input.placeholder   = '예: 지구가 점점 더워져요';
        const cols = parseInt(document.querySelector('input[name="gridsize"]:checked').value);
        input.maxLength = cols * cols;
        btn.textContent = '🎨 워크시트 만들기';
        btn.classList.remove('vocab-mode');
      }
    }

    /* ─────────────────────────────────────────
       메인 분기
    ───────────────────────────────────────── */
    function generateWorksheet() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      if (mode === '3') generateVocabWorksheet();
      else              generateWritingWorksheet();
    }

    /* ─────────────────────────────────────────
       모드 1·2: 문장 쓰기 워크시트
    ───────────────────────────────────────── */
    function generateWritingWorksheet() {
      const sentence   = document.getElementById('sentence-input').value.trim();
      const mode       = document.querySelector('input[name="mode"]:checked').value;
      const cols       = parseInt(document.querySelector('input[name="gridsize"]:checked').value);
      const totalCells = cols * cols;

      if (!sentence) { alert('연습할 문장을 입력해 주세요! 😊'); return; }
      // 띄어쓰기 포함 그대로 분리 — 공백 칸도 빈 칸으로 표시
      const chars = sentence.split('');
      if (chars.length > totalCells) {
        alert(`문장이 너무 깁니다! ${cols}×${cols} 그리드는 띄어쓰기 포함 ${totalCells}글자 이하로 입력해 주세요. 😅`);
        return;
      }

      const worksheet = document.getElementById('worksheet');
      worksheet.innerHTML = '';

      const header = document.createElement('div');
      header.className = 'ws-header';
      header.innerHTML = `<span class="ws-title">${mode === '1' ? '따라 쓸 문장: ' + sentence : '스스로 써 보세요!'}</span>`;
      worksheet.appendChild(header);

      if (mode === '2') {
        const display = document.createElement('div');
        display.className = 'ws-sentence-display';
        chars.forEach(ch => {
          const chip = document.createElement('div');
          chip.className = 'char-chip';
          // 공백은 빈 칸으로 표시
          chip.textContent = ch === ' ' ? '' : ch;
          display.appendChild(chip);
        });
        worksheet.appendChild(display);
      }

      const fontSizeMap = { 4:'clamp(50px,15vw,130px)', 6:'clamp(28px,9vw,80px)', 8:'clamp(18px,6vw,56px)', 10:'clamp(13px,4.5vw,42px)' };
      const grid = document.createElement('div');
      grid.className = 'ws-grid';
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      // [버그 수정]: 문장 반복 렌더링 로직 적용
      // 모드 1(따라 쓰기): 남는 그리드 칸에 문장을 순환 반복하되,
      //   "남은 칸이 문장 전체(L칸)를 담을 수 있을 때만" 한 번 더 채운다.
      //   남은 칸이 문장 길이보다 작으면 문장이 중간에 잘리지 않도록 그 칸들은 공백으로 비워 둔다.
      //   반복되는 문장과 문장 사이에는 빈 칸(띄어쓰기) 1칸을 둔다.
      const traceCells = new Array(totalCells).fill(''); // 기본값: 빈 칸
      if (mode === '1') {
        const L = chars.length;            // 문장 길이(공백 포함)
        let pos = 0;
        // 남은 칸(totalCells - pos)이 문장 전체를 담을 수 있을 때만 반복 배치
        while (pos + L <= totalCells) {
          for (let k = 0; k < L; k++) traceCells[pos + k] = chars[k];
          pos += L;   // 문장 한 번 배치
          pos += 1;   // 문장 사이 구분용 공백 1칸 (빈 칸 그대로 둠)
        }
        // 남은 칸이 L보다 작아 반복을 멈춘 뒤의 칸들은 기본값(공백)으로 유지됨
      }

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'ws-cell';
        cell.style.fontSize = fontSizeMap[cols];
        if (mode === '1') {
          const ch = traceCells[i];
          if (ch && ch !== ' ') {
            // 일반 글자: 연한 회색 힌트
            cell.classList.add('trace-char');
            cell.textContent = ch;
          }
          // 공백(구분 칸·문장 내 띄어쓰기) 또는 잘림 방지용으로 비운 칸: 빈 칸 그대로
        } else {
          // 모드 2(스스로 쓰기): 기존과 동일하게 모든 칸을 빈 칸으로 유지
          cell.classList.add('empty-char');
        }
        grid.appendChild(cell);
      }
      worksheet.appendChild(grid);
      showPreview();
    }

    /* ─────────────────────────────────────────
       모드 3: 단어 학습 워크시트

       그리드 설계:
       - 열(column) 수 = 단어 글자 수
         예) '광합성'(3글자) → 3열
             '암술'(2글자)  → 2열
       - 행(row) 수 = 선택한 반복 횟수 (3·6·10)
       - 1행: 회색 힌트 글자 (따라쓰기)
       - 나머지 행: 빈 칸 (스스로쓰기)
       - 각 셀은 aspect-ratio:1/1 정사각형
    ───────────────────────────────────────── */
    function generateVocabWorksheet() {
      const word   = document.getElementById('sentence-input').value.trim().replace(/\s/g, '');
      if (!word) { alert('학습할 단어를 입력해 주세요! 😊'); return; }

      const chars     = word.split('');
      const cols      = chars.length;                   // 열 수 = 글자 수
      const repeat    = parseInt(document.querySelector('input[name="vocabrepeat"]:checked').value); // 행 수
      const writeMode = document.querySelector('input[name="vocabwritemode"]:checked').value;

      /* ── 셀 크기 동적 계산 ──────────────────────────────
         A4 인쇄 기준 (@page margin:0, padding 8mm×10mm):
           가용 너비 = 210mm - 20mm(좌우 padding) = 190mm
           가용 높이 = 297mm - 16mm(상하 padding) - 18mm(헤더) = 263mm

         레이아웃:
           이미지 박스 너비 = imgW (mm)
           gap              = 6mm
           그리드 너비      = 190 - imgW - 6 (mm)

         셀 크기 결정:
           cellW = 그리드 너비 / cols
           cellH = 가용 높이 / repeat
           cellSz = min(cellW, cellH)  → 정사각형

         이미지 박스 너비: repeat이 많을수록 높이가 작아지므로
           imgH = cellSz × repeat (그리드 전체 높이)
           imgW = min(imgH, 50mm) 로 이미지도 비례 축소
      ──────────────────────────────────────────────────── */
      const PAGE_W    = 190; // mm, 가용 너비
      const PAGE_H    = 255; // mm, 가용 높이 (헤더/여백 제외)
      const GAP       = 5;   // mm, 이미지-그리드 간격
      const IMG_MAX   = 52;  // mm, 이미지 박스 최대 너비
      const IMG_MIN   = 24;  // mm, 이미지 박스 최소 너비

      // 이미지 박스를 먼저 결정 (repeat × 셀 높이가 이미지 높이가 되도록)
      // 순환 참조 방지: imgW를 고정 범위로 시작해서 역산
      function calcLayout(imgW) {
        const gridW  = PAGE_W - imgW - GAP;
        const cellW  = gridW / cols;
        const cellH  = PAGE_H / repeat;
        const cellSz = Math.min(cellW, cellH);
        return { cellSz, gridW };
      }

      // imgW를 반복 수에 맞게 결정: 이미지 높이 = 그리드 전체 높이
      // → imgH = cellSz × repeat, imgW = min(imgH, IMG_MAX)
      // 수렴할 때까지 2회 반복
      let imgW = IMG_MAX;
      for (let iter = 0; iter < 3; iter++) {
        const { cellSz } = calcLayout(imgW);
        const gridH = cellSz * repeat;
        imgW = Math.min(Math.max(gridH, IMG_MIN), IMG_MAX);
      }
      const { cellSz, gridW } = calcLayout(imgW);

      // mm → px 변환 (화면 미리보기용, 96dpi 기준 1mm = 3.7795px)
      const MM2PX = 3.7795;
      const cellPx = cellSz * MM2PX;
      const imgPx  = imgW   * MM2PX;

      // 글자 크기: 셀의 72% (여백 확보)
      const fontPx = Math.floor(cellPx * 0.72);
      // 이미지 박스 내 단어 라벨 크기: 이미지 너비에 비례
      const labelPx = Math.max(Math.floor(imgPx * 0.22), 11);

      /* ── DOM 생성 ── */
      const worksheet = document.getElementById('worksheet');
      worksheet.innerHTML = '';

      const header = document.createElement('div');
      header.className = 'ws-header';
      const modeLabel = writeMode === 'trace' ? '따라 쓰기' : '스스로 쓰기';
      header.innerHTML = `<span class="ws-title">🖼️ 단어 학습: ${word} <span style="font-size:13px;font-weight:700;color:#888;margin-left:8px;">${modeLabel}</span></span>`;
      worksheet.appendChild(header);

      const layout = document.createElement('div');
      layout.className = 'vocab-layout';
      layout.style.gap = `${GAP * MM2PX}px`;
      layout.style.alignItems = 'flex-start';

      /* ── 좌측: 이미지 + 단어 라벨 ── */
      const imageBox = document.createElement('div');
      imageBox.className = 'vocab-image-box';
      imageBox.style.width = `${imgPx}px`;

      const imgWrap = document.createElement('div');
      imgWrap.className = 'vocab-img-wrap';
      imgWrap.id = 'vocab-img-wrap';
      imgWrap.style.width  = `${imgPx}px`;
      imgWrap.style.height = `${imgPx}px`;
      imgWrap.innerHTML = `<div class="img-placeholder"><div class="spinner"></div><span>이미지 검색 중...</span></div>`;

      const wordLabel = document.createElement('div');
      wordLabel.className = 'vocab-word-label';
      wordLabel.textContent = word;
      wordLabel.style.fontSize = `${labelPx}px`;
      wordLabel.style.width = '100%';

      const imgControls = document.createElement('div');
      imgControls.className = 'img-controls no-print';

      const reloadBtn = document.createElement('button');
      reloadBtn.className = 'btn-reload-img';
      reloadBtn.textContent = '🔄 자동 검색';
      reloadBtn.style.fontSize = '11px'; reloadBtn.style.padding = '5px 8px';
      reloadBtn.onclick = () => loadVocabImage(word);

      const urlBtn = document.createElement('button');
      urlBtn.className = 'btn-reload-img';
      urlBtn.textContent = '🔗 주소로 넣기';
      urlBtn.style.fontSize = '11px'; urlBtn.style.padding = '5px 8px';
      urlBtn.onclick = () => {
        const url = prompt('이미지 주소(URL)를 붙여넣으세요.\n\n구글 이미지에서 원하는 이미지 위에\n마우스 우클릭 → "이미지 주소 복사" 후 붙여넣기!');
        if (url && url.trim()) setImageFromUrl(url.trim());
      };

      const fileInput = document.createElement('input');
      fileInput.type = 'file'; fileInput.accept = 'image/*';
      fileInput.style.display = 'none'; fileInput.id = 'vocab-file-input';
      fileInput.onchange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setImageFromUrl(ev.target.result);
        reader.readAsDataURL(file);
      };

      const fileBtn = document.createElement('button');
      fileBtn.className = 'btn-reload-img';
      fileBtn.textContent = '📁 파일 업로드';
      fileBtn.style.fontSize = '11px'; fileBtn.style.padding = '5px 8px';
      fileBtn.onclick = () => fileInput.click();

      imgControls.appendChild(reloadBtn);
      imgControls.appendChild(urlBtn);
      imgControls.appendChild(fileBtn);
      imgControls.appendChild(fileInput);

      imageBox.appendChild(imgWrap);
      imageBox.appendChild(wordLabel);
      imageBox.appendChild(imgControls);

      /* ── 우측: 반복 쓰기 그리드 ── */
      const gridBox = document.createElement('div');
      gridBox.className = 'vocab-grid-box';

      const grid = document.createElement('div');
      grid.className = 'vocab-write-grid';
      // 각 열은 정확히 cellPx, 행도 cellPx로 고정
      grid.style.gridTemplateColumns = `repeat(${cols}, ${cellPx}px)`;
      grid.style.gridAutoRows        = `${cellPx}px`;

      const totalCells = cols * repeat;

      for (let i = 0; i < totalCells; i++) {
        const rowIndex = Math.floor(i / cols);
        const colIndex = i % cols;

        const cell = document.createElement('div');
        cell.className = 'vocab-write-cell';
        cell.style.width    = `${cellPx}px`;
        cell.style.height   = `${cellPx}px`;
        cell.style.fontSize = `${fontPx}px`;

        if (writeMode === 'trace') {
          cell.classList.add('hint');
          cell.textContent = chars[colIndex];
        } else {
          if (rowIndex === 0) {
            cell.classList.add('hint');
            cell.textContent = chars[colIndex];
          } else {
            cell.classList.add('blank');
          }
        }

        grid.appendChild(cell);
      }

      gridBox.appendChild(grid);
      layout.appendChild(imageBox);
      layout.appendChild(gridBox);
      worksheet.appendChild(layout);

      showPreview();
      loadVocabImage(word);
    }

    /* ─────────────────────────────────────────
       이미지 URL로 직접 표시
       구글 이미지 주소 붙여넣기 또는 파일 업로드 모두 이 함수 사용
    ───────────────────────────────────────── */
    function setImageFromUrl(url) {
      const imgWrap = document.getElementById('vocab-img-wrap');
      if (!imgWrap) return;
      imgWrap.innerHTML = `<div class="img-placeholder"><div class="spinner"></div><span>불러오는 중...</span></div>`;
      const img = new Image();
      img.onload = () => {
        imgWrap.innerHTML = '';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
        imgWrap.appendChild(img);
      };
      img.onerror = () => {
        imgWrap.innerHTML = showImgFallback('주소가 올바르지 않거나<br>이미지를 불러올 수 없어요');
      };
      img.src = url;
      img.crossOrigin = 'anonymous';
    }

    /* ─────────────────────────────────────────
       Pixabay API 이미지 검색
       한국어 → 영어 변환 후 검색
       실패 시 직접 입력 안내로 대체
    ───────────────────────────────────────── */
    const PIXABAY_KEY = '56168825-4c01e93b42b8a36ab2b08a35d';
    const koToEn = {
      '사과':'apple','바나나':'banana','포도':'grape','수박':'watermelon',
      '딸기':'strawberry','오렌지':'orange','복숭아':'peach','배':'pear',
      '고양이':'cat','강아지':'dog','토끼':'rabbit','곰':'bear','사자':'lion',
      '호랑이':'tiger','코끼리':'elephant','기린':'giraffe','펭귄':'penguin',
      '새':'bird','물고기':'fish','나비':'butterfly','꽃':'flower',
      '나무':'tree','산':'mountain','바다':'ocean','하늘':'sky','구름':'cloud',
      '비':'rain','눈':'snow','무지개':'rainbow','태양':'sun','달':'moon',
      '별':'star','자동차':'car','버스':'bus','기차':'train','비행기':'airplane',
      '집':'house','학교':'school','병원':'hospital','사람':'person','아이':'child',
      '책':'book','연필':'pencil','가방':'bag','밥':'rice','빵':'bread',
      '우유':'milk','물':'water','케이크':'cake','피자':'pizza','치킨':'chicken',
      '수영':'swimming','축구':'soccer','야구':'baseball','농구':'basketball',
      '봄':'spring','여름':'summer','가을':'autumn','겨울':'winter',
      '광합성':'photosynthesis plant','식물':'plant','동물':'animal',
      '암술':'flower pistil','수술':'flower stamen','뿌리':'plant root',
      '줄기':'plant stem','잎':'leaf','씨앗':'seed','열매':'fruit',
      '지구':'earth globe','달':'moon','태양계':'solar system',
    };

    function showImgFallback(msg) {
      return `<div class="img-placeholder">
        <span style="font-size:36px">🖼️</span>
        <span style="font-size:12px;text-align:center;line-height:1.6;">${msg}<br><br>아래 버튼으로<br>이미지를 추가하세요!</span>
      </div>`;
    }

    function loadVocabImage(word) {
      const imgWrap = document.getElementById('vocab-img-wrap');
      if (!imgWrap) return;

      imgWrap.innerHTML = `<div class="img-placeholder"><div class="spinner"></div><span>이미지 검색 중...</span></div>`;

      const keyword = koToEn[word] || word;
      // Pixabay API 호출: 한국어 단어를 영어로 변환해서 검색
      const apiUrl = `https://pixabay.com/api/?key=${PIXABAY_KEY}&q=${encodeURIComponent(keyword)}&image_type=photo&per_page=10&safesearch=true`;

      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          if (data.hits && data.hits.length > 0) {
            // 결과 중 랜덤으로 하나 선택
            const random = data.hits[Math.floor(Math.random() * data.hits.length)];
            setImageFromUrl(random.webformatURL);
          } else {
            imgWrap.innerHTML = showImgFallback('검색 결과 없음<br>아래 버튼으로 직접 추가하세요');
          }
        })
        .catch(() => {
          imgWrap.innerHTML = showImgFallback('자동 검색 실패<br>아래 버튼으로 직접 추가하세요');
        });
    }

    /* ─────────────────────────────────────────
       공통 유틸
    ───────────────────────────────────────── */
    function showPreview() {
      const s = document.getElementById('preview-section');
      s.style.display = 'block';
      s.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // [태블릿 가로모드] 태블릿 모드 중 워크시트를 다시 만들면 화면에 맞춰 키우고 캔버스 재부착
      if (tabletActive) setTimeout(() => { fitWorksheetToScreen(); attachCanvasesToCells(); }, 80);
    }

    /* ─────────────────────────────────────────
       [태블릿 가로모드] 워크시트를 가로 화면에 꽉 차게 맞추기
       - 모드 1·2(정사각 그리드): 1fr 해상을 위해 명시적 기준 너비 부여 후 측정
       - 모드 3(단어 학습): 콘텐츠 폭(fit-content) 기준 측정
       - scale = min(가용너비/자연너비, 가용높이/자연높이) → 제약되는 쪽에 맞춰 최대 확대
       - transform: scale은 캔버스 좌표 변환(getBoundingClientRect 기반)과 호환됨
    ───────────────────────────────────────── */
    function fitWorksheetToScreen() {
      const ws   = document.getElementById('worksheet');
      const area = document.getElementById('worksheet-scale-area');
      if (!ws || !area) return;

      // 태블릿 모드가 아니면 원래 상태로 초기화
      if (!tabletActive) {
        ws.style.transform = '';
        ws.style.width = '';
        return;
      }

      const availW = area.clientWidth;
      const availH = area.clientHeight;
      if (!availW || !availH) return;

      // 측정을 위해 변환 제거 + 기준 너비 부여
      ws.style.transform = 'none';
      const hasGrid = !!ws.querySelector('.ws-grid'); // 모드 1·2 여부
      if (hasGrid) {
        // 정사각 그리드(1fr)가 정상 해상되도록 가용 너비를 기준 너비로 부여
        ws.style.width = availW + 'px';
      } else {
        // 모드 3: 콘텐츠 폭에 맞춤
        ws.style.width = 'fit-content';
      }

      // 자연 크기 측정
      const naturalW = ws.offsetWidth;
      const naturalH = ws.offsetHeight;
      if (!naturalW || !naturalH) return;

      // 가로/세로 모두 들어가도록 비율 계산 (제약되는 쪽에 맞춰 최대 크기)
      const scale = Math.min(availW / naturalW, availH / naturalH);
      ws.style.transform = `scale(${scale})`;
    }

    /* ═══════════════════════════════════════════════
       태블릿 모드 — 셀마다 Canvas 올리기
       ─ 터치/마우스/스타일러스 모두 지원
       ─ 각 셀 canvas는 독립적으로 관리
       ─ 실행 취소(undo)는 스트로크 단위로 저장
       ─ 획 평가: 이탈율 → 경고 토스트 / 잘 씀 → 파란 배경
    ═══════════════════════════════════════════════ */
    let tabletActive  = false;
    let drawColor     = '#111';
    let drawSize      = 6;
    let eraserMode    = false;   // 지우개 모드

    // strokeHistory: { canvas, imageData, cell }[] — 되돌리기용
    const strokeHistory = [];

    /* ─── 토스트 메시지 ─── */
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('guide-toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* ─── 힌트 글자 픽셀 마스크 추출 ───
       셀의 텍스트 콘텐츠를 오프스크린 캔버스에 렌더링해
       "글자가 차지하는 영역(마스크)" 을 만든다.
       hint 칸만 사용 (trace-char / hint 클래스)
    */
    function buildHintMask(cell, w, h) {
      const text = cell.textContent.trim();
      if (!text) return null;

      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const ctx = off.getContext('2d');

      // 셀의 실제 폰트 크기 읽기
      const cs = window.getComputedStyle(cell);
      const fs = parseFloat(cs.fontSize) || (w * 0.72);
      ctx.font = `700 ${fs}px 'Nanum Gothic', sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = '#000';
      ctx.fillText(text, w / 2, h / 2);

      return ctx.getImageData(0, 0, w, h);
    }

    /* ─── 획 평가 ───
       스트로크가 끝난 뒤:
       1) 캔버스에서 현재 필기 픽셀 추출
       2) 힌트 마스크와 겹치는 비율 계산
          - 필기 픽셀 중 마스크 밖에 있는 것 = 이탈 픽셀
       3) 이탈율 > WARN_RATIO → 경고 토스트 + 빨간 배경
          이탈율 ≤ GOOD_RATIO → 잘 씀 → 파란 배경

       힌트 없는 칸(빈 칸)은 이탈 체크 없이 파란 배경만.
    */
    const WARN_RATIO = 0.38;  // 이탈 픽셀이 38% 이상이면 경고
    const GOOD_RATIO = 0.22;  // 이탈 픽셀이 22% 이하면 칭찬

    function evaluateStroke(canvas, cell) {
      const w = canvas.width, h = canvas.height;
      const ctx = canvas.getContext('2d');
      const drawn = ctx.getImageData(0, 0, w, h);

      // 필기 픽셀 (alpha > 30) 수집
      const drawnPixels = [];
      for (let i = 3; i < drawn.data.length; i += 4) {
        if (drawn.data[i] > 30) drawnPixels.push(i);
      }
      if (drawnPixels.length < 20) return; // 너무 짧은 터치는 무시

      const isHintCell = cell.classList.contains('trace-char') || cell.classList.contains('hint');

      if (!isHintCell) {
        // 힌트 없는 빈 칸: 무조건 파란 배경 (쓰기만 해도 칭찬)
        markGood(cell);
        return;
      }

      // 힌트 마스크 생성 (셀 크기 기준 — 마스크 범위를 넉넉히 팽창)
      const mask = buildHintMask(cell, w, h);
      if (!mask) { markGood(cell); return; }

      // 마스크를 팽창(dilate)해서 허용 범위 넓힘 (획 굵기 보정)
      const dilated = dilateMask(mask, w, h, Math.max(drawSize * 2.2, 18));

      // 이탈 픽셀 카운트
      let outside = 0;
      for (const i of drawnPixels) {
        const pi = Math.floor(i / 4) * 4; // alpha → base index
        if (dilated.data[pi + 3] < 128) outside++;
      }

      const ratio = outside / drawnPixels.length;

      if (ratio > WARN_RATIO) {
        markWarn(cell);
        showToast('✋ 천천히 다시 써보세요!');
      } else if (ratio <= GOOD_RATIO) {
        markGood(cell);
      }
      // 중간 범위(22%~38%)는 판정 보류 — 배경 변화 없음
    }

    /* ─── 마스크 팽창 (Morphological Dilation) ───
       글자 윤곽 주변 radius 픽셀을 허용 영역으로 확장
    */
    function dilateMask(src, w, h, radius) {
      const r = Math.ceil(radius);
      const dst = new ImageData(w, h);
      const srcA = src.data;
      const dstA = dst.data;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let found = false;
          outer: for (let dy = -r; dy <= r && !found; dy++) {
            for (let dx = -r; dx <= r && !found; dx++) {
              if (dx*dx + dy*dy > r*r) continue;
              const nx = x + dx, ny = y + dy;
              if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
              if (srcA[(ny * w + nx) * 4 + 3] > 128) found = true;
            }
          }
          if (found) { dstA[(y * w + x) * 4 + 3] = 255; }
        }
      }
      return dst;
    }

    function markGood(cell) {
      cell.classList.remove('cell-warn');
      cell.classList.add('cell-good');
    }
    function markWarn(cell) {
      cell.classList.remove('cell-good');
      cell.classList.add('cell-warn');
      // 경고 배경은 1.5초 후 원래대로
      setTimeout(() => cell.classList.remove('cell-warn'), 1500);
    }

    /* ── 태블릿 모드 ON/OFF ── */
    function toggleTabletMode() {
      tabletActive = !tabletActive;
      document.body.classList.toggle('tablet-active', tabletActive);
      document.getElementById('btn-tablet').classList.toggle('active', tabletActive);
      document.getElementById('tablet-toolbar').classList.toggle('active', tabletActive);
      // [태블릿 가로모드] 버튼 라벨 토글
      document.getElementById('btn-tablet').textContent = tabletActive ? '🖥️ 태블릿 모드 끄기' : '✏️ 태블릿 모드';

      if (tabletActive) {
        // 전체화면 레이아웃이 적용된 뒤 크기를 계산해야 하므로 다음 프레임에서 실행
        requestAnimationFrame(() => {
          fitWorksheetToScreen();      // 화면에 꽉 차게 scale 주입
          attachCanvasesToCells();     // 확정된 셀 크기에 맞춰 캔버스 부착
        });
      } else {
        fitWorksheetToScreen();        // transform/width 초기화
        // 모드 끄면 지우개 상태 초기화
        if (eraserMode) { eraserMode = false; }
        const btn = document.getElementById('btn-eraser');
        btn.classList.remove('eraser-active');
        btn.textContent = '🧹 지우개';
      }
    }

    /* ── 워크시트가 다시 생성될 때 캔버스 재부착 ── */
    function attachCanvasesToCells() {
      // 기존 캔버스 모두 제거 + cell 상태 초기화
      document.querySelectorAll('.cell-canvas').forEach(c => c.remove());
      document.querySelectorAll('.ws-cell, .vocab-write-cell').forEach(c => {
        c.classList.remove('cell-good', 'cell-warn');
      });
      strokeHistory.length = 0;

      const cells = document.querySelectorAll('.ws-cell, .vocab-write-cell');
      cells.forEach(cell => {
        const canvas = document.createElement('canvas');
        canvas.className = 'cell-canvas';
        cell.appendChild(canvas);
        resizeCanvas(canvas);
        initDrawing(canvas, cell);
      });

      // ResizeObserver로 셀 크기 변화 감지 → 캔버스 리사이즈
      const ro = new ResizeObserver(() => {
        document.querySelectorAll('.cell-canvas').forEach(c => resizeCanvas(c));
      });
      cells.forEach(cell => ro.observe(cell));
    }

    /* ── 캔버스 크기를 부모 셀에 맞춤 ── */
    function resizeCanvas(canvas) {
      const cell = canvas.parentElement;
      const w = cell.offsetWidth;
      const h = cell.offsetHeight;
      if (!w || !h) return;
      let saved = null;
      if (canvas.width && canvas.height) {
        saved = canvas.toDataURL();
      }
      canvas.width  = w;
      canvas.height = h;
      if (saved) {
        const img = new Image();
        img.onload = () => canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        img.src = saved;
      }
    }

    /* ── 그리기 이벤트 초기화 ── */
    function initDrawing(canvas, cell) {
      let isDrawing = false;
      let lastX = 0, lastY = 0;
      let strokeStart = null;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const src  = e.touches ? e.touches[0] : e;
        return {
          x: (src.clientX - rect.left) * (canvas.width  / rect.width),
          y: (src.clientY - rect.top)  * (canvas.height / rect.height),
        };
      }

      function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const ctx = canvas.getContext('2d');
        strokeStart = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pos = getPos(e);
        lastX = pos.x; lastY = pos.y;
        if (eraserMode) {
          // 지우개: destination-out으로 투명하게 지움
          ctx.save();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(lastX, lastY, eraserSize() / 2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0,0,0,1)';
          ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(lastX, lastY, drawSize / 2, 0, Math.PI * 2);
          ctx.fillStyle = drawColor;
          ctx.fill();
        }
      }

      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const ctx = canvas.getContext('2d');
        const pos = getPos(e);
        if (eraserMode) {
          ctx.save();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(pos.x, pos.y);
          ctx.strokeStyle = 'rgba(0,0,0,1)';
          ctx.lineWidth   = eraserSize();
          ctx.lineCap     = 'round';
          ctx.lineJoin    = 'round';
          ctx.stroke();
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(pos.x, pos.y);
          ctx.strokeStyle = drawColor;
          ctx.lineWidth   = drawSize;
          ctx.lineCap     = 'round';
          ctx.lineJoin    = 'round';
          ctx.stroke();
        }
        lastX = pos.x; lastY = pos.y;
      }

      function endDraw(e) {
        if (!isDrawing) return;
        isDrawing = false;
        if (strokeStart) {
          strokeHistory.push({ canvas, cell, imageData: strokeStart });
          strokeStart = null;
          if (strokeHistory.length > 50) strokeHistory.shift();
        }
        // 지우개 모드일 때는 평가 없이 good 상태 해제만
        if (eraserMode) {
          cell.classList.remove('cell-good', 'cell-warn');
        } else {
          evaluateStroke(canvas, cell);
        }
      }

      canvas.addEventListener('mousedown',  startDraw);
      canvas.addEventListener('mousemove',  draw);
      canvas.addEventListener('mouseup',    endDraw);
      canvas.addEventListener('mouseleave', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove',  draw,      { passive: false });
      canvas.addEventListener('touchend',   endDraw);
    }

    /* ── 색상 변경 ── */
    function setDrawColor(el) {
      drawColor = el.dataset.color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
      // 색상 선택하면 지우개 모드 해제
      if (eraserMode) toggleEraser();
    }

    /* ── 굵기 변경 ── */
    function setDrawSize(el) {
      drawSize = parseInt(el.dataset.size);
      document.querySelectorAll('.size-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
    }

    /* ── 지우개 크기: drawSize의 3배 (넉넉하게) ── */
    function eraserSize() { return Math.max(drawSize * 3, 20); }

    /* ── 지우개 ON/OFF ── */
    function toggleEraser() {
      eraserMode = !eraserMode;
      const btn = document.getElementById('btn-eraser');
      if (eraserMode) {
        btn.classList.add('eraser-active');
        btn.textContent = '🧹 지우개 ON';
        // 커서를 지우개 모양으로
        document.querySelectorAll('.cell-canvas').forEach(c => {
          c.style.cursor = 'cell';
        });
      } else {
        btn.classList.remove('eraser-active');
        btn.textContent = '🧹 지우개';
        document.querySelectorAll('.cell-canvas').forEach(c => {
          c.style.cursor = 'crosshair';
        });
      }
    }

    /* ── 전체 지우기: 커스텀 팝업 사용 (confirm 대신) ── */
    function clearAllCanvas() {
      document.getElementById('clear-confirm-overlay').classList.add('show');
    }
    function closeClearConfirm() {
      document.getElementById('clear-confirm-overlay').classList.remove('show');
    }
    function confirmClearAll() {
      closeClearConfirm();
      document.querySelectorAll('.cell-canvas').forEach(c => {
        c.getContext('2d').clearRect(0, 0, c.width, c.height);
      });
      document.querySelectorAll('.ws-cell, .vocab-write-cell').forEach(c => {
        c.classList.remove('cell-good', 'cell-warn');
      });
      strokeHistory.length = 0;
    }

    /* ── 되돌리기 ── */
    function undoLastStroke() {
      if (!strokeHistory.length) return;
      const { canvas, cell, imageData } = strokeHistory.pop();
      canvas.getContext('2d').putImageData(imageData, 0, 0);
      cell.classList.remove('cell-good', 'cell-warn');
    }

    /* ── 워크시트 재생성 시 캔버스 재부착 ── */
    // generateWritingWorksheet / generateVocabWorksheet 호출 후 자동 재부착은
    // showPreview 안에서 처리 (아래 showPreview 재정의)

    document.getElementById('sentence-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') generateWorksheet();
    });

    document.querySelectorAll('input[name="gridsize"]').forEach(r => {
      r.addEventListener('change', function () {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === '3') return;
        const cols = parseInt(this.value);
        document.getElementById('sentence-input').maxLength = cols * cols;
        document.getElementById('sentence-input').placeholder = `예: 지구가 점점 더워져요 (최대 ${cols*cols}글자)`;
      });
    });

    // [태블릿 가로모드] 화면 회전·크기 변경 시 워크시트를 다시 화면에 맞춤
    window.addEventListener('resize', () => { if (tabletActive) fitWorksheetToScreen(); });
    window.addEventListener('orientationchange', () => {
      if (tabletActive) setTimeout(fitWorksheetToScreen, 250);
    });
  </script>
</body>
</html>
